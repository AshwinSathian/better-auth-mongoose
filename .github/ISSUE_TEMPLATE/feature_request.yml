name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Which package?
      options:
        - better-auth-mongoose
        - better-auth-mongoose-tenant
        - Not sure / new package
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that isn't possible (or is awkward) today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API shape, config option, or behavior you'd like to see. Doesn't need to be final.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
