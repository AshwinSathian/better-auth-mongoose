name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # Pinned to the npm 11.x line, not "latest": npm 12 removed the legacy
      # --git-checks passthrough that pnpm 9's `pnpm publish` still relies on
      # when it delegates to npm under the hood, turning what npm 11 treats
      # as a deprecation warning into a hard EUNKNOWNCONFIG failure.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create release PR or publish
        # v2 renamed the `publish`/`version` inputs used on v1 to
        # `publish-script`/`version-script` (confirmed against v2.1.1's own
        # action.yml) — updated below to match, not just the pinned SHA.
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
