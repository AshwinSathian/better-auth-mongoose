name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # Pinned to the npm 11.x line, not "latest": npm 12 removed the legacy
      # --git-checks passthrough that pnpm 9's `pnpm publish` still relies on
      # when it delegates to npm under the hood, turning what npm 11 treats
      # as a deprecation warning into a hard EUNKNOWNCONFIG failure.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create release PR or publish
        # Reverted from v2 (briefly live in d342243): v2 requires
        # @changesets/cli v3 and hard-errors on v2, which is what this repo
        # still pins ("This version of the Changesets action is designed to
        # work with Changesets CLI v3.") — confirmed by an actual failed run
        # (https://github.com/AshwinSathian/better-auth-mongoose/actions/runs/33964442009),
        # not caught beforehand since there's no way to dry-run this action
        # short of pushing to main. Back on v1 until @changesets/cli is
        # bumped to v3 and tested alongside it, not before.
        #
        # changesets/action has no tagged v1.x release past v1.9.0 — the
        # floating "v1" this reads is a mutable branch (refs/heads/v1), not
        # a tag, so pinning to a tag like every other action here isn't
        # available for this exact major. Pinned to that branch's tip as of
        # this change; re-resolve via `git ls-remote
        # https://github.com/changesets/action.git refs/heads/v1` before
        # bumping again, since there's no version tag to diff against.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
