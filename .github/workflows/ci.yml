name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        better-auth-version: ["^1.4.0", "^1.5.0", "^1.6.0"]
    env:
      # Pinned so the binary cache key below stays valid run to run, and so
      # a silent upstream version bump can't change test behavior underneath
      # us. Bump deliberately alongside the mongodb-memory-server devDep.
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin better-auth version under test
        run: pnpm --filter better-auth-mongoose add -D better-auth@${{ matrix.better-auth-version }}
      - run: pnpm build
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - name: Pre-download the MongoDB binary once, serially
        run: pnpm --filter better-auth-mongoose exec node scripts/warm-mongodb-binary.mjs
      - run: pnpm test

  # better-auth-mongoose-tenant's exec-time enforcement (exec-scope.ts)
  # reads Query.prototype.exec, getFilter()/getUpdate(), and Mongoose's own
  # internal op set directly, not just the documented public methods most
  # adapters call. That's a real version-drift risk across the package's
  # claimed ^6.0.0-^9.0.0 peer range, verified here rather than assumed: no
  # build step, since the tests import from src/ directly and building
  # against an older Mongoose's types isn't the point of this job (that's
  # what lint-and-typecheck already covers, against the pinned version).
  tenant-mongoose-compat:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongoose-version: ["^6.0.0", "^7.0.0", "^8.0.0"]
    env:
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Swap in the matrix Mongoose version for the tenant package
        run: pnpm --filter better-auth-mongoose-tenant add -D mongoose@${{ matrix.mongoose-version }}
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - name: Pre-download the MongoDB binary once, serially
        run: pnpm --filter better-auth-mongoose-tenant exec node scripts/warm-mongodb-binary.mjs
      - run: pnpm --filter better-auth-mongoose-tenant exec vitest run

  example-e2e:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    env:
      MONGOMS_VERSION: 8.2.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter better-auth-mongoose build
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - name: Pre-download the MongoDB binary once, serially
        run: pnpm --filter better-auth-mongoose exec node scripts/warm-mongodb-binary.mjs
      - run: pnpm --filter nestjs-mongoose-example test:e2e
